modLoader="javafml"
loaderVersion="${loader_range}"
issueTrackerURL="${mod_issues}"
license="${mod_license}"

[[mods]]
    modId="${mod_id}"
    version="${mod_version}"
    displayName="${mod_name}"
    updateJSONURL="${mod_update_json}"
    displayURL="${mod_homepage}"
    logoFile="logo.png"
    authors="${mod_authors}"
    description='''
    ${mod_description}
    '''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${loader_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_range}"
    ordering="NONE"
    side="BOTH"
