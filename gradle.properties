# ── Gradle ──────────────────────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G
org.gradle.parallel=true
org.gradle.caching=true
# Loom's remap/decompile tasks are not configuration-cache safe.
org.gradle.configuration-cache=false

# ── Mod identity ────────────────────────────────────────────────────────────
# Shared by every node; the node is appended as build metadata to the jar name,
# e.g. taghelper-1.2.0+1.21.1-neoforge.jar
mod.id=taghelper
mod.name=Tag Helper Plus
mod.group=io.github.samarium150
mod.version=1.2.0
mod.license=GNU GENERAL PUBLIC LICENSE Version 3
mod.description=Mod for editing item NBT and data components by commands
mod.authors=Samarium, Rustypredator
mod.source=https://www.curseforge.com/minecraft/mc-mods/taghelper
mod.issues=https://github.com/Rustypredator/TagHelper/issues
mod.update_json=https://raw.githubusercontent.com/Rustypredator/TagHelper/main/docs/update.json
