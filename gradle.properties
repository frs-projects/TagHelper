# Memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true

# Mod coordinates. The mod version is shared by every target; the Minecraft
# version and loader are appended per target to produce the jar name, e.g.
#   taghelper-1.21.1-neoforge-1.1.0.jar
mod_id=taghelper
mod_version=1.2.0
mod_group=io.github.samarium150
mod_name=Tag Helper Plus
mod_authors=Samarium, Rustypredator
mod_license=GNU GENERAL PUBLIC LICENSE Version 3
mod_description=Mod for editing item NBT and data components by commands
mod_issues=https://github.com/Rustypredator/TagHelper/issues
mod_homepage=https://www.curseforge.com/minecraft/mc-mods/taghelper
mod_update_json=https://raw.githubusercontent.com/Rustypredator/TagHelper/main/docs/update.json
