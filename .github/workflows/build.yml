name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  # The matrix is read from gradle/targets.gradle rather than duplicated here,
  # so adding a Minecraft version stays a one-line change.
  matrix:
    name: Read build matrix
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.read.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/wrapper-validation@v4
      - id: read
        run: echo "targets=$(./gradlew -q printTargets)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target.name }}
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.matrix.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Gradle runs on 21; the target's own toolchain is provisioned by Gradle.
          java-version: |
            21
            ${{ matrix.target.java }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Build ${{ matrix.target.name }}
        run: ./gradlew :${{ matrix.target.name }}:build

      - uses: actions/upload-artifact@v4
        with:
          name: taghelper-${{ matrix.target.name }}
          path: versions/${{ matrix.target.name }}/build/libs/*.jar
          if-no-files-found: error
