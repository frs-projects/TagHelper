import java.text.SimpleDateFormat

plugins {
    id 'net.neoforged.moddev'             version '2.0.146' apply false
    id 'net.neoforged.moddev.legacyforge' version '2.0.146' apply false
}

// Every target shares one mod version; see gradle.properties.
version = project.property('mod_version')
group = project.property('mod_group')

// ---------------------------------------------------------------------------
// Per-target configuration.
//
// Each target is assembled from source layers rather than from a source tree of
// its own. A class in a layer is compiled into every target that includes that
// layer, so a fix written once in common/ lands in every jar. Classes that must
// differ per Minecraft version or per loader live at the SAME fully-qualified
// name in competing layers, and exactly one of those layers is on any given
// target's source path. See docs/PORTING.md for the contract those classes owe
// the common code.
// ---------------------------------------------------------------------------
gradle.ext.modTargets.each { target ->
    project(":${target.name}") {
        apply plugin: 'java'

        version = rootProject.version
        group = rootProject.group

        base {
            // Produces e.g. taghelper-1.21.1-neoforge-1.1.0.jar
            archivesName = "${rootProject.property('mod_id')}-${target.minecraft}-${target.loader}"
        }

        java.toolchain.languageVersion = JavaLanguageVersion.of(target.java)

        sourceSets.main {
            java.srcDirs = target.layers.collect { rootProject.file("${it}/src/main/java") }
            resources.srcDirs = target.layers.collect { rootProject.file("${it}/src/main/resources") }

            // A target may drop extra classes or resources in versions/<name>/
            // when it needs something no shared layer provides.
            java.srcDir file('src/main/java')
            resources.srcDir file('src/main/resources')
        }

        if (target.loader == 'neoforge') {
            apply plugin: 'net.neoforged.moddev'
            neoForge {
                version = target.loaderVersion
                runs {
                    client { client() }
                    server { server() }
                }
                mods {
                    "${rootProject.property('mod_id')}" { sourceSet sourceSets.main }
                }
            }
        } else {
            apply plugin: 'net.neoforged.moddev.legacyforge'
            legacyForge {
                version = "${target.minecraft}-${target.loaderVersion}"
                runs {
                    client { client() }
                    server { server() }
                }
                mods {
                    "${rootProject.property('mod_id')}" { sourceSet sourceSets.main }
                }
            }
        }

        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
            options.release = target.java
        }

        // Mod metadata is templated so the loader and Minecraft version ranges
        // stay in lockstep with the matrix instead of drifting per branch.
        tasks.named('processResources') {
            def tokens = [
                    mod_id           : rootProject.property('mod_id'),
                    mod_version      : rootProject.version.toString(),
                    mod_name         : rootProject.property('mod_name'),
                    mod_authors      : rootProject.property('mod_authors'),
                    mod_license      : rootProject.property('mod_license'),
                    mod_description  : rootProject.property('mod_description'),
                    mod_issues       : rootProject.property('mod_issues'),
                    mod_homepage     : rootProject.property('mod_homepage'),
                    mod_update_json  : rootProject.property('mod_update_json'),
                    minecraft_version: target.minecraft,
                    minecraft_range  : target.mcRange,
                    loader           : target.loader,
                    loader_version   : target.loaderVersion,
                    loader_range     : target.loaderRange,
                    pack_format      : target.packFormat.toString(),
            ]
            inputs.properties tokens
            filesMatching(['META-INF/*.toml', 'pack.mcmeta']) {
                expand tokens
            }
        }

        tasks.named('jar') {
            manifest {
                attributes([
                        'Specification-Title'     : rootProject.property('mod_name'),
                        'Specification-Vendor'    : rootProject.property('mod_authors'),
                        'Specification-Version'   : '1',
                        'Implementation-Title'    : rootProject.property('mod_name'),
                        'Implementation-Version'  : rootProject.version.toString(),
                        'Implementation-Vendor'   : rootProject.property('mod_authors'),
                        'Implementation-Timestamp': new SimpleDateFormat('yyyy-MM-dd').format(new Date()),
                        'MC-Version'              : target.minecraft,
                        'Mod-Loader'              : target.loader,
                ])
            }
        }
    }
}

// ---------------------------------------------------------------------------
// Aggregate tasks
// ---------------------------------------------------------------------------

tasks.register('buildAll') {
    group = 'build'
    description = 'Compiles and jars every target in the matrix.'
    dependsOn gradle.ext.modTargets.collect { ":${it.name}:build" }
}

tasks.register('collectJars', Copy) {
    group = 'build'
    description = 'Builds every target and gathers the shippable jars into build/dist.'
    // Names carry the Minecraft version and loader, so a collision means two
    // matrix entries resolved to the same jar name.
    duplicatesStrategy = DuplicatesStrategy.FAIL
    into layout.buildDirectory.dir('dist')
    gradle.ext.modTargets.each { target ->
        def sub = project(":${target.name}")
        dependsOn "${sub.path}:assemble"
        // For legacy Forge targets ModDevGradle puts the un-reobfuscated jar in
        // build/devlibs, so build/libs always holds the production jar.
        from(sub.layout.buildDirectory.dir('libs')) { include '*.jar' }
    }
}

tasks.register('printTargets') {
    group = 'help'
    description = 'Prints the build matrix as JSON, for the CI job matrix.'
    def targets = gradle.ext.modTargets.collect {
        [name: it.name, minecraft: it.minecraft, loader: it.loader, java: it.java]
    }
    doLast {
        println groovy.json.JsonOutput.toJson(targets)
    }
}
